server:
  port: 8083
logging:
  level:
    com.butorin.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/tasks/**
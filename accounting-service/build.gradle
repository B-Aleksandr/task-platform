plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.butorin'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

def jacocoBusinessIncludes = [
        '**/com/butorin/accounting/controller/**',
        '**/com/butorin/accounting/service/**',
]

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs).collect { dir ->
        fileTree(dir: dir, includes: jacocoBusinessIncludes)
    })
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs).collect { dir ->
        fileTree(dir: dir, includes: jacocoBusinessIncludes)
    })
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}
